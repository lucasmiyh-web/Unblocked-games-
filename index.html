<!doctype html>
<html lang="en">

    <script>
      window.onerror = function(msg, url, lineNo, columnNo, error) {
        var div = document.getElementById('error-display') || document.createElement('div');
        div.id = 'error-display';
        div.style = 'position:fixed; top:0; left:0; right:0; background:#991b1b; color:white; padding:15px; font-family:monospace; z-index:999999; font-size:12px; border-bottom:2px solid black;';
        div.innerHTML = '<b>System Error Detected:</b><br>' + msg + '<br><small>Line: ' + lineNo + ' | ' + url + '</small>';
        document.body.appendChild(div);
        return false;
      };
    </script>
  </head>
  <body>
    <div id="root"></div>

      setTimeout(function() {

            '<div><h1 style="margin:0; font-size:1.5rem;">System Load Failure</h1>' +
            '<p style="color:#64748b; font-size:0.875rem; margin-top:10px;">The app is taking too long to start. This may be due to school restrictions or an outdated browser.</p>' +
            '<button onclick="window.location.reload()" style="margin-top:20px; padding:10px 20px; border-radius:10px; border:none; background:white; color:#0f172a; font-weight:bold; cursor:pointer;">Retry</button></div></div>';
        }
      }, 5000);
